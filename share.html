<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Social Calendar — Fat Possum</title>
  <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { overflow: auto; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 32px 16px 60px; }
    header { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
    header img { width: 44px; height: 44px; object-fit: contain; }
    header h1 { font-size: 20px; font-weight: 600; }
    header p { color: var(--text-muted); font-size: 12px; }
    .date-h { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); font-weight: 600; margin: 22px 0 8px; }
    .date-h.today { color: var(--accent); }
    .post { cursor: default; }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="FP-Logo_Submark-Black.jpg" alt="Fat Possum" />
    <div><h1 id="h">Social Calendar</h1><p>Shared by Fat Possum Records · read-only · updates live</p></div>
  </header>
  <div class="toolbar" style="margin-bottom:8px">
    <label><input type="checkbox" id="past"> Show past posts</label>
  </div>
  <div id="out"><div class="empty">Loading…</div></div>
</div>
<script>
  // Must match CONFIG.API_BASE in app.js.
  const API_BASE = ['localhost', '127.0.0.1'].includes(location.hostname) ? 'http://localhost:8787' : 'https://fp-projects-api.fatpossum.workers.dev';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ymd = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const fmt = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }); };
  const slug = s => String(s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-');
  const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '';
  let data = null;

  async function load() {
    const t = new URLSearchParams(location.search).get('t');
    const out = document.getElementById('out');
    if (!t) { out.innerHTML = '<div class="empty">This link is missing its access code.</div>'; return; }
    try {
      const r = await fetch(API_BASE + '/share/' + encodeURIComponent(t));
      data = await r.json();
      if (!r.ok) throw new Error(data.error || 'Not found');
      document.getElementById('h').textContent = data.artist.name + ' — Social Calendar';
      document.title = data.artist.name + ' — Social Calendar';
      render();
    } catch (e) { out.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
  }

  function render() {
    const today = ymd(new Date()), past = document.getElementById('past').checked;
    const days = {};
    for (const p of data.posts) if (past || p.date >= today) (days[p.date] ||= { posts: [], rel: [] }).posts.push(p);
    for (const r of data.releases) if (past || r.release_date >= today) (days[r.release_date] ||= { posts: [], rel: [] }).rel.push(r);
    const keys = Object.keys(days).sort();
    const color = data.artist.color || '#7a7468';
    document.getElementById('out').innerHTML = keys.length ? keys.map(d => `
      <div class="date-h${d === today ? ' today' : ''}">${d === today ? 'Today · ' : ''}${fmt(d)}</div>
      ${days[d].rel.map(r => r.kind === 'timeline'
        ? `<div class="mark ms" style="margin-bottom:6px">◆ ${esc(r.title)}</div>`
        : `<div class="mark" style="margin-bottom:6px">★ Release: ${esc(r.title)}${r.format ? ' [' + esc(r.format) + ']' : ''}</div>`).join('')}
      <div style="display:flex;flex-direction:column;gap:6px">${days[d].posts.map(p => `
        <div class="post big" style="border-left-color:${esc(color)}">
          <div class="p-top">${p.time ? `<span class="mono">${esc(p.time)}</span>` : ''}<b>${esc((p.platforms && p.platforms.length ? p.platforms : [p.platform]).filter(Boolean).join(', '))}</b>${p.post_type ? `<span>· ${esc(p.post_type)}</span>` : ''}<span class="spacer" style="flex:1"></span>${p.status ? `<span class="badge s-${slug(p.status)}">${esc(p.status)}</span>` : ''}</div>
          ${p.caption ? `<div class="p-cap">${esc(p.caption)}</div>` : ''}
          ${safeUrl(p.asset_url) || safeUrl(p.link_url) ? `<div class="hint" style="margin-top:4px">${safeUrl(p.asset_url) ? `<a href="${esc(p.asset_url)}" target="_blank" rel="noopener">Asset ↗</a>` : ''} ${safeUrl(p.link_url) ? `<a href="${esc(p.link_url)}" target="_blank" rel="noopener">Link ↗</a>` : ''}</div>` : ''}
        </div>`).join('')}</div>`).join('') : '<div class="empty">Nothing scheduled yet.</div>';
  }
  document.getElementById('past').onchange = () => data && render();
  load();
</script>
</body>
</html>
